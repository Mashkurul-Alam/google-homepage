<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Homepage Clone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="https://mail.google.com">Gmail</a>
  <a href="https://www.google.com/imghp">Images</a>
  <button class="apps" aria-label="Google apps">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </button>
  <a class="sign-in" href="https://accounts.google.com">Sign in</a>
</header>

<main>
  <h1 class="logo" aria-label="Mashkurul’s kingdom">
    <span class="b">M</span><span class="r">a</span><span class="y">s</span><span class="b">h</span><span class="g">k</span><span class="r">u</span><span class="b">r</span><span class="r">u</span><span class="y">l</span><span class="b">’</span><span class="g">s</span> <span class="r">k</span><span class="b">i</span><span class="r">n</span><span class="y">g</span><span class="b">d</span><span class="g">o</span><span class="r">m</span>
  </h1>

  <div class="search-box">
    <div class="search-bar" id="bar">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="q" type="text" autocomplete="off" aria-label="Search" autofocus>
      <button class="clear" id="clear" aria-label="Clear search">&times;</button>
    </div>
    <ul class="suggestions" id="list" role="listbox"></ul>
  </div>

  <div class="buttons">
    <button id="search-btn">Google Search</button>
    <button id="lucky-btn">I Am Mashkurul</button>
  </div>

  <p class="offered">Google offered in: <a href="#">বাংলা</a></p>
</main>

<footer>
  <div class="row"><span>Bangladesh</span></div>
  <div class="row">
    <div><a href="#">Advertising</a><a href="#">Business</a><a href="#">How Search works</a></div>
    <div><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Settings</a></div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
